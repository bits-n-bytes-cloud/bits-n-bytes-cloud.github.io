<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Eintrag anzeigen</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; }
    .item { margin: 0.25rem 0; }
    .label { font-weight: 600; }
    .value { white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Eintrag</h1>
  <div id="content">Lade…</div>

  <script>
    // == Konfiguration: bitte anpassen ==
    const POCKETBASE_URL = 'https://pocketbase.ralfes.cloud'; // Deine PocketBase-URL
    const COLLECTION = 'm365';                         // Collection-Name
    // Feldnamen exakt wie in PocketBase:
    const FIELDS = ['MCID', 'Title', 'Service', 'Datum', 'Summary', 'More_Infos'];

    const params = new URLSearchParams(window.location.search);
    const recordId = params.get('id'); // z.B. ?id=b9chf1q2x3...
    const contentEl = document.getElementById('content');

    // Hilfsfunktionen
    const formatValue = (key, val) => {
      if (val == null) return '';
      // Datum formatieren (optional; falls 'Datum' ein ISO-String ist)
      if (key === 'Datum') {
        try {
          const d = new Date(val);
          if (!Number.isNaN(d.getTime())) {
            // Ausgabe: TT.MM.JJJJ HH:MM (lokal)
            return d.toLocaleString('de-DE', { year: 'numeric', month: '2-digit', day: '2-digit' });
          }
        } catch {}
      }
      // Links in More_infos (falls du dort eine URL speicherst)
      if (key === 'More_infos' && typeof val === 'string' && /^https?:\/\//i.test(val)) {
        // Keine innerHTML für allgemeine Felder, aber hier gezielt ein Link-Element erzeugen
        const a = document.createElement('a');
        a.href = val;
        a.target = '_blank';
        a.rel = 'noopener';
        a.textContent = val;
        return a; // wird später als Node eingefügt
      }
      // Standard: Text
      return String(val);
    };

    if (!recordId) {
      contentEl.textContent = 'Fehler: Es wurde keine "id" übergeben.';
    } else {
      const url = `${POCKETBASE_URL}/api/collections/${encodeURIComponent(COLLECTION)}/records/${encodeURIComponent(recordId)}`;

      fetch(url)
        .then(r => {
          if (!r.ok) throw new Error(`HTTP ${r.status}`);
          return r.json();
        })
        .then(data => {
          // Ausgabe-Container leeren
          contentEl.textContent = '';
          // Für jedes gewünschte Feld eine Zeile rendern
          for (const key of FIELDS) {
            const row = document.createElement('div');
            row.className = 'item';

            const label = document.createElement('span');
            label.className = 'label';
            label.textContent = `${key}: `;

            const valueEl = document.createElement('span');
            valueEl.className = 'value';

            const formatted = formatValue(key, data?.[key]);
            if (formatted instanceof Node) {
              valueEl.appendChild(formatted);
            } else {
              valueEl.textContent = formatted;
            }

            row.appendChild(label);
            row.appendChild(valueEl);
            contentEl.appendChild(row);
          }
        })
        .catch(err => {
          contentEl.textContent = `Fehler beim Laden: ${err.message}`;
        });
    }
  </script>
</body>
</html>
